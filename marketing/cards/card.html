<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubo hanging card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Small hanging retail card, A7 portrait: 74 x 105 mm trimmed, plus 3 mm bleed = 80 x 111 mm.
     A 6 mm hang hole is punched 6 mm below the top edge, centred. Safe margin from the trim edge: 4 mm.
       card.html?p=os|office            front and back (2 pages), for the printer
       card.html?p=os&key=1             the back as printed UNDER the silver coating, with the hole marked (proof) */
  @page { size: 80mm 111mm; margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff }
  body { font-family: 'Inter', system-ui, sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased }
  :root { --mu: #6E6E73; --mu2: #8E8E93; --acc: #F26F00; --line: rgba(0,0,0,.14) }
  .page { position: relative; width: 80mm; height: 111mm; overflow: hidden; break-after: page; page-break-after: always;
          background: linear-gradient(#FFFFFF, #EEEEF2); padding: 7mm; display: flex; flex-direction: column }
  .page:last-child { break-after: auto; page-break-after: auto }
  .page > * { flex-shrink: 0 }
  .hole { position: absolute; left: 50%; top: 9mm; width: 6mm; height: 6mm; margin: -3mm 0 0 -3mm; border: .25mm dashed #E5007D; border-radius: 50% }
  .holelab { position: absolute; left: 50%; top: 14mm; transform: translateX(-50%); font-size: 1.7mm; color: #E5007D; white-space: nowrap }

  /* FRONT */
  .brandrow { display: flex; justify-content: space-between; align-items: center; margin-top: 11mm }
  .made { font-size: 2.3mm; font-weight: 600; color: var(--mu) } .made em { font-style: normal; color: var(--acc) }
  .tile { align-self: center; margin-top: 7mm; width: 27mm; height: 27mm; border-radius: 6.4mm; display: grid; place-items: center; overflow: hidden;
          box-shadow: 0 2mm 5mm rgba(0,0,0,.22), 0 0 0 .2mm rgba(0,0,0,.08) }
  .tile.os { background: linear-gradient(155deg, #2e3446, #11131a) }
  .tile.os img { width: 15mm; height: auto }
  .tile.office img { width: 100%; height: 100% }
  h1 { text-align: center; margin-top: 5.5mm; font-size: 8.6mm; line-height: 1; font-weight: 600; letter-spacing: -.045em }
  .sub { text-align: center; margin-top: 2mm; font-size: 3.1mm; line-height: 1.35; color: var(--mu) }
  .pills { display: flex; justify-content: center; gap: 1.8mm; margin-top: 4.4mm }
  .pill { font-size: 2.8mm; font-weight: 600; padding: 1.3mm 3mm; border-radius: 99px; background: #fff; box-shadow: 0 0 0 .22mm var(--line) }
  .pill.hot { background: var(--acc); color: #fff; box-shadow: none }
  .mrp { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; padding-top: 3mm }
  .mrp small { font-size: 2.2mm; color: var(--mu); line-height: 1.35 }
  .mrp b { display: block; font-size: 8mm; line-height: 1; font-weight: 600; letter-spacing: -.04em }

  /* BACK */
  .btop { display: flex; justify-content: space-between; align-items: center; margin-top: 11mm }
  .logo { display: flex; align-items: center; gap: 1.4mm; font-size: 3.4mm; font-weight: 600; letter-spacing: -.01em }
  .logo img { height: 3.8mm; width: auto } .logo img.mark { filter: invert(1) } .logo img.app { border-radius: .9mm }
  .plabel { margin-top: 4mm; font-size: 2.2mm; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--acc) }
  /* The scratch panel: silver coating in print, the key is printed under it. */
  .panel { margin-top: 1.6mm; height: 14mm; border-radius: 2mm; position: relative; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(115deg, #cfcfd5 0%, #f6f6f9 22%, #b7b7bf 45%, #ececf1 68%, #c3c3ca 100%); box-shadow: inset 0 0 0 .25mm rgba(0,0,0,.18), 0 .5mm 1.4mm rgba(0,0,0,.12);
           font-size: 2.9mm; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #6c6c74 }
  .panel::before { content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>") }
  .panel span { position: relative }
  .panel.under { background: #fff; box-shadow: inset 0 0 0 .25mm var(--line); color: #111; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 3.7mm; letter-spacing: .05em }
  .panel.under::before { display: none }
  .serial { margin-top: 1.4mm; font-size: 2mm; color: var(--mu); letter-spacing: .05em } .serial b { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; color: #1D1D1F }
  .steps { margin-top: 4.4mm; display: grid; gap: 2.2mm }
  .step { display: flex; gap: 2.2mm; align-items: center; font-size: 2.9mm; line-height: 1.25 }
  .step i { flex: none; width: 4.6mm; height: 4.6mm; border-radius: 50%; background: #1D1D1F; color: #fff; font-style: normal; font-weight: 600; font-size: 2.5mm; display: grid; place-items: center }
  .step b { font-weight: 600 }
  .foot { margin-top: auto; display: grid; grid-template-columns: auto 1fr auto; gap: 2.4mm; align-items: end }
  .bar { width: 27mm; height: 11.5mm; border: .25mm dashed rgba(0,0,0,.3); border-radius: 1mm; display: grid; place-items: center; text-align: center; font-size: 1.7mm; line-height: 1.3; color: var(--mu2) }
  .qr { width: 11.5mm; height: 11.5mm; background: #fff; border-radius: 1.1mm; padding: .6mm; box-shadow: 0 0 0 .2mm var(--line) }
  .qr img { width: 100%; height: 100%; display: block }
  .legal { margin-top: 2.2mm; font-size: 1.75mm; line-height: 1.4; color: var(--mu2) } .legal b { color: var(--mu); font-weight: 600 }
</style>
</head>
<body>
<div id="out"></div>
<script>
  const q = new URLSearchParams(location.search);
  const p = q.get('p') || 'os', under = q.get('key') === '1';
  const C = {
    os: {
      logo: ['../flyers/assets/mark.svg', 'Nubo OS', 'mark'],
      tile: '<div class="tile os"><img src="../flyers/assets/mark.svg" alt=""></div>',
      title: 'Nubo Pro', sub: 'Priority updates and support<br>for Nubo OS',
      mrp: '₹499', serial: 'NBOS-2610-000001',
      s1: ['Install', 'os.nubosuite.tech'], s2: ['Activate', 'Nubo Setup, then Activate'], s3: ['Done', 'Pro starts straight away']
    },
    office: {
      logo: ['../flyers/assets/icon-Office.svg', 'Nubo Office', 'app'],
      tile: '<div class="tile office"><img src="../flyers/assets/icon-Office.svg" alt=""></div>',
      title: 'Nubo Office', sub: 'Write, Cells, Present and Draw.<br>Opens Word, Excel and PowerPoint',
      mrp: '₹499', serial: 'NBOF-2610-000001',
      s1: ['Install', 'nubosuite.tech/office'], s2: ['Activate', 'Nubo Office, then Activate'], s3: ['Done', 'Your office suite is ready']
    }
  }[p];
  const MARKETER = 'Marketed by: [company name and address]';
  const front = `
  <section class="page">
    <div class="brandrow"><div class="logo"><img class="${C.logo[2]}" src="${C.logo[0]}" alt="">${C.logo[1]}</div><div class="made">Made in <em>Bharat</em></div></div>
    ${C.tile}
    <h1>${C.title}</h1>
    <div class="sub">${C.sub}</div>
    <div class="pills"><span class="pill hot">1 device</span><span class="pill">1 year</span></div>
    <div class="mrp"><small>MRP, inclusive<br>of all taxes</small><b>${C.mrp}</b></div>
  </section>`;
  const back = `
  <section class="page">
    <div class="btop"><div class="logo"><img class="${C.logo[2]}" src="${C.logo[0]}" alt="">${C.logo[1]}</div><div class="made">1 device · 1 year</div></div>
    <div class="plabel">Your product key</div>
    <div class="panel ${under ? 'under' : ''}" id="panel"><span>${under ? 'XXXX-XXXX-XXXX-XXXX' : 'Scratch here'}</span></div>
    <div class="serial">Serial no. <b>${C.serial}</b></div>
    <div class="steps">
      <div class="step"><i>1</i><div><b>${C.s1[0]}</b> · ${C.s1[1]}</div></div>
      <div class="step"><i>2</i><div><b>${C.s2[0]}</b> · ${C.s2[1]}</div></div>
      <div class="step"><i>3</i><div><b>${C.s3[0]}</b> · ${C.s3[1]}</div></div>
    </div>
    <div class="legal">One key, one device, one year from activation. No refund once scratched. <b>${MARKETER}</b></div>
    <div class="foot" style="margin-top:2.2mm">
      <div class="bar">EAN-13 BARCODE<br>(GS1 India)</div>
      <div></div>
      <div class="qr"><img src="assets/qr-activate.svg" alt=""></div>
    </div>
    ${under ? '<div class="hole" style="top:-2mm;display:none"></div>' : ''}
  </section>`;
  const holeProof = under ? '<div class="hole"></div><div class="holelab">hang hole 6 mm</div>' : '';
  const pages = under ? back.replace('</section>', holeProof + '</section>') : front + back;
  document.getElementById('out').innerHTML = pages;
  document.title = 'Nubo card ' + p;
</script>
</body>
</html>
