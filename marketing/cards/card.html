<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubo activation card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Retail scratch card, A6 portrait (105 x 148 mm) plus 3 mm bleed = 111 x 154 mm.
     card.html?p=os|office   front and back in one file (2 pages)
     card.html?p=os&key=1    the back as it is printed UNDER the scratch coating (printer's proof)
     Sizes are in cqw (percent of the 111 mm page width): 1cqw = 1.11 mm. Safe margin from the trim edge: 5 mm. */
  @page { size: 111mm 154mm; margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff }
  body { font-family: 'Inter', system-ui, sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased }
  :root { --mu: #6E6E73; --mu2: #8E8E93; --acc: #F26F00; --line: rgba(0,0,0,.12) }
  .page { position: relative; width: 111mm; height: 154mm; overflow: hidden; container-type: size; break-after: page; page-break-after: always;
          background: linear-gradient(#FFFFFF, #EFEFF3); padding: 7.2cqw; display: flex; flex-direction: column }
  .page:last-child { break-after: auto; page-break-after: auto }
  .page > * { flex-shrink: 0 } .page > .stage { flex-shrink: 1 }
  .top { display: flex; justify-content: space-between; align-items: center }
  .logo { display: flex; align-items: center; gap: 1.6cqw; font-size: 4.4cqw; font-weight: 600; letter-spacing: -.01em }
  .logo img { height: 5cqw; width: auto }
  .logo img.mark { filter: invert(1) }
  .logo img.app { border-radius: 1.2cqw; height: 5.6cqw }
  .made { font-size: 2.6cqw; font-weight: 600; color: var(--mu) } .made em { font-style: normal; color: var(--acc) }
  h1 { margin-top: 8cqw; font-size: 12cqw; line-height: 1; font-weight: 600; letter-spacing: -.045em }
  .sub { margin-top: 2.6cqw; font-size: 3.8cqw; line-height: 1.38; color: var(--mu); max-width: 84cqw }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center }
  .laptop { width: 86cqw; filter: drop-shadow(0 3cqw 5cqw rgba(0,0,0,.26)) }
  .lid { background: #0a0a0c; border-radius: 1.6cqw 1.6cqw 0 0; padding: .9cqw .9cqw 0; border: .2cqw solid #34343a; border-bottom: 0 }
  .lid img { display: block; width: 100%; border-radius: .7cqw .7cqw 0 0 }
  .base { height: 1.5cqw; margin: 0 -3cqw; border-radius: 0 0 2.2cqw 2.2cqw; background: linear-gradient(#cfcfd4, #a5a5ab); position: relative }
  .base::after { content: ''; position: absolute; left: 50%; top: 0; width: 11cqw; height: .6cqw; transform: translateX(-50%); border-radius: 0 0 .9cqw .9cqw; background: #8d8d93 }
  .row { display: flex; justify-content: space-between; align-items: flex-end }
  .pills { display: flex; gap: 2cqw }
  .pill { font-size: 3.2cqw; font-weight: 600; padding: 1.6cqw 3.2cqw; border-radius: 99px; background: #fff; box-shadow: 0 0 0 .25cqw var(--line) }
  .pill.hot { background: var(--acc); color: #fff; box-shadow: none }
  .mrp { text-align: right; font-size: 2.5cqw; color: var(--mu); line-height: 1.35 }
  .mrp b { display: block; font-size: 8cqw; line-height: 1; font-weight: 600; letter-spacing: -.04em; color: #1D1D1F }

  /* back */
  h2 { margin-top: 6cqw; font-size: 8cqw; line-height: 1.03; font-weight: 600; letter-spacing: -.04em }
  .plabel { margin-top: 6cqw; font-size: 2.6cqw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--acc) }
  /* The scratch panel. In print this is the silver scratch-off coating; the key is printed underneath. */
  .panel { margin-top: 2.4cqw; height: 20cqw; border-radius: 2.4cqw; position: relative; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(115deg, #cfcfd5 0%, #f6f6f9 22%, #b7b7bf 45%, #ececf1 68%, #c3c3ca 100%); box-shadow: inset 0 0 0 .3cqw rgba(0,0,0,.18), 0 .6cqw 1.6cqw rgba(0,0,0,.12);
           font-size: 3.4cqw; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #6c6c74 }
  .panel::before { content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>") }
  .panel span { position: relative }
  .panel.under { background: #fff; box-shadow: inset 0 0 0 .3cqw var(--line); color: #111; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 5.4cqw; letter-spacing: .08em }
  .panel.under::before { display: none }
  .steps { margin-top: 5.4cqw; display: grid; gap: 3cqw }
  .step { display: flex; gap: 3cqw; align-items: flex-start }
  .step i { flex: none; width: 6cqw; height: 6cqw; border-radius: 50%; background: #1D1D1F; color: #fff; font-style: normal; font-weight: 600; font-size: 3.2cqw; display: grid; place-items: center }
  .step b { display: block; font-size: 3.5cqw; font-weight: 600 }
  .step span { display: block; margin-top: .4cqw; font-size: 2.9cqw; line-height: 1.38; color: var(--mu) }
  .legal { margin-top: auto; padding-top: 3cqw; font-size: 2.1cqw; line-height: 1.45; color: var(--mu2) }
  .legal b { color: var(--mu); font-weight: 600 }
  .serial { margin-top: 2cqw; font-size: 2.5cqw; color: var(--mu); letter-spacing: .06em } .serial b { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; color: #1D1D1F }
  .foot { margin-top: 3cqw; padding-top: 3cqw; border-top: .25cqw solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 4cqw; align-items: center }
  .bar { width: 33cqw; height: 15cqw; border: .3cqw dashed rgba(0,0,0,.3); border-radius: 1.2cqw; display: grid; place-items: center; text-align: center; font-size: 2.1cqw; line-height: 1.3; color: var(--mu2); letter-spacing: .04em }
  .support { font-size: 2.6cqw; line-height: 1.45; color: var(--mu) } .support b { color: #1D1D1F; font-weight: 600 }
  .qr { width: 15cqw; height: 15cqw; background: #fff; border-radius: 1.4cqw; padding: .8cqw; box-shadow: 0 0 0 .25cqw var(--line) }
  .qr img { width: 100%; height: 100%; display: block }
</style>
</head>
<body>
<div id="out"></div>
<script>
  const q = new URLSearchParams(location.search);
  const p = q.get('p') || 'os', under = q.get('key') === '1';
  const C = {
    os: {
      logo: ['../flyers/assets/mark.svg', 'Nubo OS', 'mark'],
      title: 'Nubo Pro',
      sub: 'Priority updates and support for your Nubo OS desktop, for one year.',
      screen: '../flyers/assets/desktop.jpg',
      pills: ['1 device', '1 year'], mrp: '₹499', serial: 'NBOS-2610-000001',
      install: 'Download Nubo OS free at os.nubosuite.tech and install it.',
      activate: 'Open Nubo Setup, choose Activate and type your key.',
      done: 'Pro support and priority updates start straight away.',
      terms: 'One key activates one device. Valid for one year from activation. The key cannot be refunded or exchanged once the panel is scratched.'
    },
    office: {
      logo: ['../flyers/assets/icon-Office.svg', 'Nubo Office', 'app'],
      title: 'Nubo Office',
      sub: 'Write, Cells, Present and Draw. Opens your Word, Excel and PowerPoint files.',
      screen: '../flyers/assets/office-screen.jpg',
      pills: ['1 device', '1 year'], mrp: '₹499', serial: 'NBOF-2610-000001',
      install: 'Get Nubo Office at nubosuite.tech/office and install it.',
      activate: 'Open Nubo Office, choose Activate and type your key.',
      done: 'Your office suite is ready to use.',
      terms: 'One key activates one device. Valid for one year from activation. The key cannot be refunded or exchanged once the panel is scratched.'
    }
  }[p];
  const MARKETER = 'Marketed by: [company name and address to be filled in before printing]';
  const front = `
  <section class="page">
    <div class="top"><div class="logo"><img class="${C.logo[2]}" src="${C.logo[0]}" alt="">${C.logo[1]}</div><div class="made">Made in <em>Bharat</em></div></div>
    <h1>${C.title}</h1>
    <div class="sub">${C.sub}</div>
    <div class="stage"><div class="laptop"><div class="lid"><img src="${C.screen}" alt=""></div><div class="base"></div></div></div>
    <div class="row">
      <div class="pills"><span class="pill hot">${C.pills[0]}</span><span class="pill">${C.pills[1]}</span></div>
      <div class="mrp">MRP, inclusive of all taxes<b>${C.mrp}</b></div>
    </div>
  </section>`;
  const back = `
  <section class="page">
    <div class="top"><div class="logo"><img class="${C.logo[2]}" src="${C.logo[0]}" alt="">${C.logo[1]}</div><div class="made">${C.pills[0]} · ${C.pills[1]}</div></div>
    <h2>Activate in<br>three steps.</h2>
    <div class="plabel">Your product key</div>
    <div class="panel ${under ? 'under' : ''}" id="panel"><span>${under ? 'XXXX-XXXX-XXXX-XXXX' : 'Scratch here'}</span></div>
    <div class="serial">Serial no. <b>${C.serial}</b></div>
    <div class="steps">
      <div class="step"><i>1</i><div><b>Install</b><span>${C.install}</span></div></div>
      <div class="step"><i>2</i><div><b>Activate</b><span>${C.activate}</span></div></div>
      <div class="step"><i>3</i><div><b>Done</b><span>${C.done}</span></div></div>
    </div>
    <div class="legal">${C.terms}<br><b>${MARKETER}</b></div>
    <div class="foot">
      <div class="bar">EAN-13 BARCODE<br>(GS1 India)</div>
      <div class="support"><b>Help</b><br>docs.nubosuite.tech<br>nubosuite.tech/activate</div>
      <div class="qr"><img src="assets/qr-activate.svg" alt=""></div>
    </div>
  </section>`;
  document.getElementById('out').innerHTML = under ? back : front + back;
  document.title = 'Nubo card ' + p;
</script>
</body>
</html>
