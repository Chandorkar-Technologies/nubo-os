<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubo flyer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet">
<style>
  /* Nubo flyers: studio-white direction. One file, three flyers, two sizes.
     flyer.html?f=os|office|bundle&size=a4|social
     Everything is sized in cqw (percent of page width), so A4 and the 4:5 post share one design. */
  @page { size: A4; margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #F6F6F8 }
  body { font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased }
  .page { position: relative; overflow: hidden; container-type: size; background: linear-gradient(#FBFBFD, #EDEDF1); display: flex; flex-direction: column; align-items: center; padding: 7.5cqw 8cqw 5.5cqw; text-align: center }
  body.a4 .page { width: 210mm; height: 297mm }
  body.social .page { width: 1080px; height: 1350px }

  .logo { display: flex; align-items: center; gap: 1.6cqw; font-size: 3.2cqw; font-weight: 600; letter-spacing: -.01em }
  .logo img { height: 4cqw; width: auto }
  .logo img.mark { filter: invert(1) }
  .logo img.app { border-radius: .9cqw }

  h1 { margin-top: 8cqw; font-size: 10.6cqw; line-height: 1.03; font-weight: 600; letter-spacing: -.045em; text-wrap: balance }
  /* the flag, left to right; the soft edge keeps the white band readable on a white page */
  h1 em { font-style: normal; background: linear-gradient(90deg, #FF9933 0 37%, #fff 37% 63%, #138808 63% 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 .12cqw rgba(0,0,0,.85)) drop-shadow(0 .1cqw .3cqw rgba(0,0,0,.35)) }
  .sub { margin-top: 2.6cqw; font-size: 3.5cqw; color: #6E6E73; line-height: 1.35 }

  .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center }
  .laptop { width: 86cqw; filter: drop-shadow(0 4cqw 7cqw rgba(0,0,0,.28)) }
  body.social .laptop { width: 76cqw }
  .lid { background: #0a0a0c; border-radius: 1.8cqw 1.8cqw 0 0; padding: 1cqw 1cqw 0; border: .22cqw solid #34343a; border-bottom: 0 }
  .lid img { display: block; width: 100%; border-radius: .8cqw .8cqw 0 0 }
  .base { height: 1.7cqw; margin: 0 -3.5cqw; border-radius: 0 0 2.4cqw 2.4cqw; background: linear-gradient(#cfcfd4, #a5a5ab); position: relative }
  .base::after { content: ''; position: absolute; left: 50%; top: 0; width: 12cqw; height: .7cqw; transform: translateX(-50%); border-radius: 0 0 1cqw 1cqw; background: #8d8d93 }

  .row { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; text-align: left }
  .price { font-size: 3.6cqw; line-height: 1.5; color: #6E6E73 }
  .price b { display: block; font-size: 8cqw; font-weight: 600; letter-spacing: -.04em; color: #1D1D1F; line-height: 1.05 }
  .price b small { font-size: 3.4cqw; font-weight: 500; color: #6E6E73; letter-spacing: 0 }
  .qrbox { text-align: center; font-size: 2.3cqw; color: #6E6E73; line-height: 1.4 }
  .qr { background: #fff; border-radius: 1.4cqw; padding: .9cqw; width: 15.5cqw; height: 15.5cqw; margin: 0 auto 1.2cqw; box-shadow: 0 0 0 .2cqw rgba(0,0,0,.08) }
  .qr img { width: 100%; height: 100%; display: block }
  .fine { margin-top: 3.2cqw; font-size: 1.9cqw; color: #8E8E93; letter-spacing: .01em }
</style>
</head>
<body>
<div class="page" id="p"></div>
<script>
  const q = new URLSearchParams(location.search);
  const f = q.get('f') || 'os', size = q.get('size') || 'a4';
  document.body.classList.add(size);
  const F = {
    os: {
      logo: ['assets/mark.svg', 'Nubo OS', 'mark'],
      h1: 'The desktop,<br>made in <em>Bharat</em>.',
      sub: 'Free to download. Secure by design.',
      screen: 'assets/desktop.jpg',
      lab: 'Pro support', price: '₹499', unit: 'a year', alt: 'or ₹2,999 once',
      qr: 'assets/qr-os.svg', cta: 'Scan to download free',
      fine: 'Nubo OS is free. Pro support: per device, inclusive of GST. Servers from ₹9,999 a year.'
    },
    office: {
      logo: ['assets/icon-Office.svg', 'Nubo Office', 'app'],
      h1: 'The office suite,<br>made in <em>Bharat</em>.',
      sub: 'Write, Cells, Present and Draw.',
      screen: 'assets/hero.jpg',
      lab: 'Nubo Office', price: '₹2,499', unit: 'once', alt: 'or ₹499 a year',
      qr: 'assets/qr-office.svg', cta: 'Scan to see it',
      fine: 'One plan, everything included. Per device, inclusive of GST.'
    },
    bundle: {
      logo: ['assets/mark.svg', 'Nubo', 'mark'],
      h1: 'All you need,<br>made in <em>Bharat</em>.',
      sub: 'Nubo OS Pro and Nubo Office, together.',
      screen: 'assets/bundle-screen.jpg',
      lab: 'Pro + Office', price: '₹799', unit: 'a year', alt: 'or ₹3,999 once. Save ₹1,499.',
      qr: 'assets/qr-os.svg', cta: 'Scan to get started',
      fine: 'Per device, inclusive of GST.'
    }
  }[f];
  document.title = 'Nubo flyer: ' + f;
  document.getElementById('p').innerHTML = `
    <div class="logo"><img class="${F.logo[2]}" src="${F.logo[0]}" alt="">${F.logo[1]}</div>
    <h1>${F.h1}</h1>
    <div class="sub">${F.sub}</div>
    <div class="stage"><div class="laptop"><div class="lid"><img src="${F.screen}" alt=""></div><div class="base"></div></div></div>
    <div class="row">
      <div class="price">${F.lab}<b>${F.price} <small>${F.unit}</small></b>${F.alt}</div>
      <div class="qrbox"><div class="qr"><img src="${F.qr}" alt=""></div>${F.cta}</div>
    </div>
    <div class="fine">${F.fine}</div>`;
</script>
</body>
</html>
