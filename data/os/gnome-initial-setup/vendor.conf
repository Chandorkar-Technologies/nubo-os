# First-run welcome on Nubo OS.
# Pages that only make sense for Ubuntu itself are left out. Names are the
# page-table entries in gnome-initial-setup's sources (not the class ids):
#   ubuntu_pro       Ubuntu Pro subscription offer
#   ubuntu_insights  Ubuntu usage reporting
#   appearance       Ubuntu accent-colour picker (Nubo OS is monochrome)
[pages]
skip=ubuntu_pro;ubuntu_insights;appearance
