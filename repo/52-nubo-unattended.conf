// Nubo OS: install security and Nubo updates automatically, reboot only on request.
// Nubo updates come from whichever channel the machine follows (nubo-channel).
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Origins-Pattern {
        "origin=Ubuntu,codename=${distro_codename}-security";
        "origin=Ubuntu,codename=${distro_codename}-updates";
        "origin=Nubo,codename=${distro_codename}";
        "origin=Nubo,codename=${distro_codename}-beta";
};
