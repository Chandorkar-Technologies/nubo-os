# Drone pipelines for ci.hostingduty.com. Runs on tags only.
# Tag v0.8.0-beta1 (contains a dash): build and publish to the beta channel.
# Tag v0.8.0 (no dash): promote what beta carries into stable. No rebuild.
# Needs Drone secrets: nubo_gpg_private_key, r2_access_key_id, r2_secret_access_key, r2_endpoint.
# Images: built by the images-* pipelines on our own build VMs (ci/setup-build-vm.sh).
# arm64 packages: see ci/debs-arm64.drone.yml (needs a Drone runner on an arm64
# machine; until one exists, upload arm64 builds by hand, they stay in the archive).
kind: pipeline
type: docker
name: debs-amd64

platform: {os: linux, arch: amd64}
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}

steps:
  - name: build
    image: ubuntu:26.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      NUBO_RELEASE: "1"
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - apt-get update -qq && apt-get install -y -qq ca-certificates
      - sh ci/use-cumulus.sh
      - apt-get update -qq
      - apt-get install -y -qq git curl ca-certificates build-essential devscripts equivs rclone
      - vendor/fetch.sh
      - mk-build-deps -i -r -t 'apt-get -y' debian/control
      - dpkg-buildpackage -us -uc -b
      - mkdir -p out && mv ../*.deb out/
      - ci/stage-upload.sh amd64 out

---
kind: pipeline
type: docker
name: publish

platform: {os: linux, arch: amd64}
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}
depends_on: [debs-amd64]

steps:
  - name: archive
    image: ubuntu:26.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      GPG_KEY: {from_secret: nubo_gpg_private_key}
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - apt-get update -qq && apt-get install -y -qq ca-certificates
      - sh ci/use-cumulus.sh
      - apt-get update -qq && apt-get install -y -qq reprepro rclone gnupg
      - echo "$GPG_KEY" | gpg --batch --import
      - ci/publish-staged.sh "$DRONE_TAG"

---
# Every image, built on our own build VMs (Drone exec runners; set one up with
# ci/setup-build-vm.sh). ISOs and disk images need root, loop mounts and chroot,
# which Docker pipelines on an untrusted repository cannot have, and each
# architecture builds on its own CPU. Both run after the packages are published.
kind: pipeline
type: exec
name: images-amd64

platform: {os: linux, arch: amd64}
node: {nubo-builder: "true"}
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}
depends_on: [debs-amd64, publish]

steps:
  - name: build
    environment:
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - ci/build-all.sh "${DRONE_TAG#v}" amd64

---
kind: pipeline
type: exec
name: images-arm64

platform: {os: linux, arch: arm64}
node: {nubo-builder: "true"}
# Stays pending until an arm64 runner is registered; nothing else waits for it yet.
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}
depends_on: [debs-amd64, publish]

steps:
  - name: build
    environment:
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - ci/build-all.sh "${DRONE_TAG#v}" arm64

---
# Writes the release's manifest and signed checksums, points the beta channel at
# it and rebuilds the website's download page.
kind: pipeline
type: exec
name: release-images

platform: {os: linux, arch: amd64}
node: {nubo-builder: "true"}
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}
# images-arm64 needs an arm64 runner (ci/setup-build-vm.sh on an arm64 machine). Until one
# exists it is not waited for; add it back here once it runs.
depends_on: [images-amd64]

steps:
  - name: publish
    environment:
      GPG_KEY: {from_secret: nubo_gpg_private_key}
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - echo "$GPG_KEY" | gpg --batch --import
      - ci/publish-release.sh "${DRONE_TAG#v}"

---
# Nubo Office: Collabora's code built under Nubo names as a Flatpak, published to our own
# Flatpak repository. Slow (hours), so it has its own tag: office-26.04.3.3-1 builds upstream
# tag coda-26.04.3.3-1 as 26.04.3.3-nubo1. See https://docs.nubosuite.tech/office/collabora/pipeline/.
kind: pipeline
type: exec
name: office-amd64

platform: {os: linux, arch: amd64}
node: {nubo-builder: "true"}
trigger: {event: [tag], ref: {include: ['refs/tags/office-*']}}

steps:
  - name: build
    environment:
      GPG_KEY: {from_secret: nubo_gpg_private_key}
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - echo "$GPG_KEY" | gpg --batch --import
      - export GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
      - REL="${DRONE_TAG#office-}"
      - ci/build-office.sh "coda-${REL}" "${REL%-*}-nubo${REL##*-}"

---
kind: pipeline
type: docker
name: cleanup

platform: {os: linux, arch: amd64}
trigger: {event: [tag], ref: {include: ['refs/tags/*-*'], exclude: ['refs/tags/office-*']}}
depends_on: [publish, release-images]

steps:
  - name: purge-staging
    image: ubuntu:26.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - apt-get update -qq && apt-get install -y -qq ca-certificates
      - sh ci/use-cumulus.sh
      - apt-get update -qq && apt-get install -y -qq rclone
      - ci/purge-staging.sh

---
kind: pipeline
type: docker
name: promote

platform: {os: linux, arch: amd64}
trigger: {event: [tag], ref: {exclude: ['refs/tags/*-*']}}

steps:
  - name: promote
    image: ubuntu:26.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      GPG_KEY: {from_secret: nubo_gpg_private_key}
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - apt-get update -qq && apt-get install -y -qq ca-certificates
      - sh ci/use-cumulus.sh
      - apt-get update -qq && apt-get install -y -qq reprepro rclone gnupg
      - echo "$GPG_KEY" | gpg --batch --import
      - ci/promote.sh
  - name: promote-images
    image: node:24-bookworm
    environment:
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    commands:
      - apt-get update -qq && apt-get install -y -qq rclone python3 ca-certificates
      - ci/promote-images.sh

---
kind: pipeline
type: docker
name: docs

platform: {os: linux, arch: amd64}
trigger:
  event: [push]
  branch: [master]

steps:
  - name: docs
    image: node:24-slim
    environment:
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    when:
      paths:
        include: ['docs-site/**', 'ci/deploy-docs.sh']
    commands:
      - apt-get update -qq && apt-get install -y -qq rclone ca-certificates
      - ci/deploy-docs.sh

---
kind: pipeline
type: docker
name: web

platform: {os: linux, arch: amd64}
trigger:
  event: [push]
  branch: [master]

steps:
  - name: web
    image: node:24-bookworm
    environment:
      R2_ACCESS_KEY_ID: {from_secret: r2_access_key_id}
      R2_SECRET_ACCESS_KEY: {from_secret: r2_secret_access_key}
      R2_ENDPOINT: {from_secret: r2_endpoint}
    when:
      paths:
        include: ['website/**', 'ci/deploy-web.sh']
    commands:
      - apt-get update -qq && apt-get install -y -qq rclone ca-certificates python3
      - ci/deploy-web.sh
